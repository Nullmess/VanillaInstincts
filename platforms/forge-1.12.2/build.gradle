buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'fr.vanillainstincts'
archivesBaseName = 'vanilla-instincts-forge-mc1.12.2'
sourceCompatibility = targetCompatibility = '1.8'

def repoRoot = file('../..').canonicalFile

def familyRoot = new File(repoRoot, 'platforms/shared/minecraft-1.12.2')
def adapterRoot = new File(repoRoot, 'platforms/adapters/forge/minecraft-1.12.2')
def coreRoot = new File(repoRoot, 'core-legacy')

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client { workingDirectory project.file('run/client') }
        server { workingDirectory project.file('run/server') }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864'
    compileOnly 'com.google.code.gson:gson:2.8.0'
    compileOnly 'com.google.guava:guava:21.0'
}

sourceSets {
    main {
        java.srcDirs = [
            new File(coreRoot, 'src/main/java'),
            new File(familyRoot, 'src/main/java'),
            new File(adapterRoot, 'src/main/java')
        ]
        resources.srcDirs = [
            new File(familyRoot, 'src/main/resources'),
            new File(adapterRoot, 'src/main/resources')
        ]
        // Client rendering, Mixins, possession networking and the modern
        // Forge event facade are ported in a later 1.12 pass.  Keep this
        // first compiler pass focused on the shared server gameplay layer.
        java.exclude 'fr/vanillainstincts/client/**'
        java.exclude 'fr/vanillainstincts/mixin/**'
        java.exclude 'fr/vanillainstincts/network/**'
        java.exclude 'fr/vanillainstincts/possession/**'
        java.exclude 'fr/vanillainstincts/command/**'
        java.exclude 'fr/vanillainstincts/village/VillagerGrandMasterProgressDisplay.java'
        java.exclude 'fr/vanillainstincts/registry/VanillaInstinctsMobEffects.java'
        java.exclude 'fr/vanillainstincts/ai/PillagerTacticsController.java'
        java.exclude 'fr/vanillainstincts/ai/PillagerOutpostLootController.java'
        java.exclude 'fr/vanillainstincts/event/CombatEvents.java'
        java.exclude 'fr/vanillainstincts/event/CommandEvents.java'
        java.exclude 'fr/vanillainstincts/event/CreatureLifecycleEvents.java'
        java.exclude 'fr/vanillainstincts/event/ServerLifecycleEvents.java'
        java.exclude 'fr/vanillainstincts/event/VanillaInstinctsEventRegistrar.java'
        java.exclude 'fr/vanillainstincts/event/VillageInteractionEvents.java'
        java.exclude 'fr/vanillainstincts/event/WorldInteractionEvents.java'
    }
}

compileJava.options.encoding = 'UTF-8'
jar {
    manifest {
        attributes([
            'Specification-Title': 'Vanilla Instincts',
            'Specification-Vendor': 'Vanilla Instincts',
            'Specification-Version': '1.0.0',
            'Implementation-Title': 'Vanilla Instincts',
            'Implementation-Version': '1.0.0',
            'Implementation-Vendor': 'Vanilla Instincts',
            'MixinConfigs': 'vanillainstincts.mixins.json'
        ])
    }
}
jar.finalizedBy('reobfJar')
