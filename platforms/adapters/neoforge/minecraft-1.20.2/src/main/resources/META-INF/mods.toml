modLoader="javafml"
loaderVersion="${target_loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Vanilla Instincts"
credits="Built for the Minecraft and NeoForge communities."
description='''
Vanilla Instincts expands the natural intelligence of Minecraft creatures while preserving their original powers, roles and vanilla identity.
Villagers work and build, animals cooperate, hostile mobs use smarter tactics and selected vanilla mechanics gain deeper behaviour.
'''

[features.${mod_id}]
javaVersion="[17,)"

[modproperties.${mod_id}]
release_channel="${mod_release_channel}"
release_date="${mod_release_date}"


[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="[${target_neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${target_minecraft_version_range}"
ordering="NONE"
side="BOTH"
